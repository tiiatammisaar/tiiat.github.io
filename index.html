    function photoPlaceId(r,photo){const name=photoNorm(photo.place);if(!name||name==='spordiobjekt')return r.places.length===1?r.places[0].id:null;const exact=r.places.find(p=>photoNorm(p.name)===name);if(exact)return exact.id;const candidates=r.places.filter(p=>{const placeName=photoNorm(p.name);return placeName&&(name.includes(placeName)||placeName.includes(name))}).sort((a,b)=>photoNorm(b.name).length-photoNorm(a.name).length);return candidates[0]?.id||(r.places.length===1?r.places[0].id:null)}
    function galleryHtml(r,place=null){const all=(window.PHOTO_DATA||{})[r.id]||[];const photos=place?all.filter(photo=>photoPlaceId(r,photo)===place.id):all.filter(photo=>!photoPlaceId(r,photo));if(!photos.length)return '';const title=place?`Fotod (${photos.length})`:`Objekti üldfotod (${photos.length})`;const label=place?`${place.name} fotod`:`${r.name} üldfotod`;return `<section class="photo-gallery" aria-label="${esc(label)}"><h4>${title}</h4><div class="photo-grid">${photos.map(photo=>`<a class="photo-item" href="${esc(photo.src)}" target="_blank" rel="noopener"><img src="${esc(photo.src)}" alt="${esc(photo.alt)}" loading="lazy"><span class="photo-caption">${esc(photo.place||r.name)}</span></a>`).join('')}</div></section>`}
    function placeHtml(r,p){return `<div class="place"><div class="place-head"><div><h4>${esc(p.name||'Nimetu sportimispaik')}</h4><p class="place-type">${esc(p.type)}</p></div></div><div class="place-grid"><div class="datum"><span>Pindala</span><strong>${fmt(p.area)}${p.area!=null?' m²':''}</strong></div><div class="datum"><span>Mõõdud</span><strong>${p.length&&p.width?`${fmt(p.length)} × ${fmt(p.width)} m`:'—'}</strong></div><div class="datum"><span>Kõrgus</span><strong>${p.height?`${fmt(p.height)} m`:'—'}</strong></div><div class="datum"><span>Põrand</span><strong>${esc(p.floor||'—')}</strong></div></div>${p.sports.length?`<p class="sports"><strong>Spordialad:</strong> ${esc(p.sports.join(', '))}</p>`:''}${galleryHtml(r,p)}</div>`}
    function cardHtml(r){const places=matchingPlaces(r);const shown=(state.placeType||state.floor.length||state.minArea)?places:r.places;const maxArea=Math.max(0,...shown.map(p=>p.area||0));const placeSummary=`<div class="place-summary"><ul>${shown.map(p=>`<li>${esc(p.name||'Nimetu sportimispaik')}</li>`).join('')}</ul></div>`;return `<article class="card" id="card-${r.id}"><div class="card-main"><div><h3>${esc(r.name)}</h3><p class="address">${esc(r.address)}</p><div class="tags"><span class="tag">${esc(r.municipality)}</span></div>${placeSummary}</div><div class="card-stats"><div class="stat"><strong>${shown.length}</strong><span>sportimispaika</span></div><div class="stat"><strong>${maxArea?fmt(maxArea)+' m²':'—'}</strong><span>suurim pindala</span></div></div></div><button class="details-toggle" type="button" aria-expanded="false" aria-controls="details-${r.id}" data-id="${r.id}"><span>Vaata täpsemat infot ja kontaktandmeid</span><span class="chevron" aria-hidden="true">⌄</span></button><div class="details" id="details-${r.id}" hidden>${shown.map(p=>placeHtml(r,p)).join('')||'<p>Sportimispaikade detailid puuduvad.</p>'}${galleryHtml(r)}<div class="actions"><a class="button primary" href="${esc(r.registryUrl)}" target="_blank" rel="noopener">Ava spordiregistris</a>${r.website?`<a class="button secondary" href="${esc(/^https?:/.test(r.website)?r.website:'https://'+r.website)}" target="_blank" rel="noopener">Koduleht</a>`:''}${r.lat&&r.lon?`<a class="button secondary" href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}" target="_blank" rel="noopener">Ava kaardil</a>`:''}</div></div></article>`}
    function renderChips(){const labels={search:'Otsing',municipality:'Omavalitsus',placeType:'Liik',floor:'Põrand',minArea:'Pindala'};const arrays=new Set(['floor','municipality']);const chips=Object.entries(labels).filter(([k])=>arrays.has(k)?state[k].length:state[k]).map(([k,l])=>`<span class="chip">${l}: ${esc(arrays.has(k)?state[k].join(', '):state[k])}${k==='minArea'?' m²':''}<button type="button" data-clear="${k}" aria-label="Eemalda filter ${esc(l)}">×</button></span>`);$('activeFilters').innerHTML=chips.join('')}
    function render(){const rows=filtered();const pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));page=Math.min(page,pages);const start=(page-1)*PAGE_SIZE;$('resultCount').textContent=`Leitud ${rows.length} objekti ja ${rows.reduce((n,r)=>n+matchingPlaces(r).length,0)} sobivat sportimispaika`;$('cards').innerHTML=rows.length?rows.slice(start,start+PAGE_SIZE).map(cardHtml).join(''):`<div class="panel empty"><h3>Ühtegi sobivat paika ei leitud</h3><p>Muuda või tühjenda filtreid ja proovi uuesti.</p><button class="button primary" type="button" onclick="clearAll()">Tühjenda filtrid</button></div>`;$('pagination').innerHTML=rows.length>PAGE_SIZE?`<button type="button" data-page="prev" ${page===1?'disabled':''}>← Eelmine</button><span>${page} / ${pages}</span><button type="button" data-page="next" ${page===pages?'disabled':''}>Järgmine →</button>`:'';renderChips()}
    ['search','placeType','minArea'].forEach(id=>$(id).addEventListener(id==='search'||id==='minArea'?'input':'change',e=>{state[id]=e.target.value;page=1;render()}));
    let municipalitySelectionTime=0;
    $('municipalityOptions').addEventListener('change',e=>{if(!e.target.matches('input[name="municipality"]'))return;municipalitySelectionTime=performance.now();state.municipality=selectedMunicipalities();syncMunicipalitySummary();page=1;render()});
    $('floorOptions').addEventListener('change',e=>{if(!e.target.matches('input[name="floor"]'))return;state.floor=selectedFloors();syncFloorQuick();page=1;render()});
    $('woodFloorQuick').addEventListener('change',e=>{document.querySelectorAll('input[name="floor"]').forEach(input=>{if(WOOD_FLOORS.includes(input.value))input.checked=e.target.checked});state.floor=selectedFloors();syncFloorQuick();page=1;render()});
    function clearFloors(){state.floor=[];document.querySelectorAll('input[name="floor"]').forEach(input=>input.checked=false);syncFloorQuick()} function clearMunicipalities(){state.municipality=[];document.querySelectorAll('input[name="municipality"]').forEach(input=>input.checked=false);syncMunicipalitySummary()} function clearAll(){Object.assign(state,{search:'',placeType:'',minArea:''});clearFloors();clearMunicipalities();['search','placeType','minArea'].forEach(id=>$(id).value='');$('municipalitySelect').open=false;page=1;render()} $('clearFilters').addEventListener('click',clearAll);
    function syncFilterScroll(){const panel=document.querySelector('.filters');const workspace=document.querySelector('.workspace');if(window.innerWidth<=860){panel.scrollTop=0;return}const maxPanelScroll=panel.scrollHeight-panel.clientHeight;const start=workspace.offsetTop-16;const distance=Math.max(1,workspace.scrollHeight-window.innerHeight+32);const progress=Math.max(0,Math.min(1,(window.scrollY-start)/distance));panel.scrollTop=maxPanelScroll*progress}
    let filterScrollFrame=0,lastWindowScrollY=window.scrollY;function requestFilterSync(){if(filterScrollFrame)return;filterScrollFrame=requestAnimationFrame(()=>{filterScrollFrame=0;syncFilterScroll()})}function closeMunicipalityOnUserScroll(){if($('municipalitySelect').open)$('municipalitySelect').open=false}function handleWindowScroll(){const moved=Math.abs(window.scrollY-lastWindowScrollY)>1;lastWindowScrollY=window.scrollY;if(moved&&performance.now()-municipalitySelectionTime>350)closeMunicipalityOnUserScroll();requestFilterSync()}window.addEventListener('scroll',handleWindowScroll,{passive:true});window.addEventListener('wheel',closeMunicipalityOnUserScroll,{passive:true,capture:true});window.addEventListener('touchmove',closeMunicipalityOnUserScroll,{passive:true,capture:true});window.addEventListener('resize',requestFilterSync);
    document.addEventListener('click',e=>{const toggle=e.target.closest('.details-toggle');if(toggle){const detail=$(`details-${toggle.dataset.id}`);const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));detail.hidden=open}const clear=e.target.closest('[data-clear]');if(clear){const k=clear.dataset.clear;if(k==='floor')clearFloors();else if(k==='municipality')clearMunicipalities();else{state[k]='';$(k).value=''}page=1;render()}const nav=e.target.closest('[data-page]');if(nav){page+=nav.dataset.page==='next'?1:-1;render();$('resultsTitle').scrollIntoView({behavior:'smooth'})}});render();syncMunicipalitySummary();syncFilterScroll();
    const PAGE_SCROLL_KEYS=new Set(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' ']);document.addEventListener('keydown',e=>{if(!PAGE_SCROLL_KEYS.has(e.key)||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,select,textarea'))return;e.preventDefault();closeMunicipalityOnUserScroll();if(e.key==='Home')window.scrollTo({top:0});else if(e.key==='End')window.scrollTo({top:document.documentElement.scrollHeight});else{const amount=e.key==='ArrowDown'?80:e.key==='ArrowUp'?-80:e.key==='PageDown'?window.innerHeight*.85:e.key==='PageUp'?-window.innerHeight*.85:e.shiftKey?-window.innerHeight*.85:window.innerHeight*.85;window.scrollBy({top:amount})}});
  </script>
</body></html>
